<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Front Heart Arrow Options</title>
    <style>
      :root {
        --bg: #f0e7d6;
        --ink: #3d3629;
        --muted: rgba(61, 54, 41, 0.54);
        --gold: #a98545;
        --gold-soft: rgba(169, 133, 69, 0.34);
        --pink: #d8a0b0;
        --pink-soft: rgba(216, 160, 176, 0.24);
        --wine: #8c3446;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 38px 18px;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 50% 0%, rgba(255, 252, 242, 0.92), transparent 52%),
          linear-gradient(180deg, #f7f0e3, var(--bg));
        font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      }

      main {
        width: min(980px, 100%);
        margin: 0 auto;
      }

      header {
        display: grid;
        justify-items: center;
        gap: 10px;
        margin-bottom: 30px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 4.8vw, 3.3rem);
        font-weight: 400;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      header p {
        margin: 0;
        color: var(--muted);
        font-size: 0.78rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .rule {
        width: 70px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(16px, 3vw, 28px);
      }

      .option {
        display: grid;
        gap: 12px;
        justify-items: center;
      }

      .die {
        display: grid;
        place-items: center;
        width: min(100%, 210px);
        aspect-ratio: 1;
        border: 1px solid rgba(176, 141, 79, 0.38);
        border-radius: 22px;
        background-color: #fffaf2;
        background-image:
          radial-gradient(circle at 27% 18%, rgba(255, 255, 255, 0.95), transparent 31%),
          radial-gradient(circle at 78% 82%, rgba(176, 141, 79, 0.18), transparent 35%),
          linear-gradient(145deg, #fffdf8, #eee3cf);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.74),
          inset -10px -12px 20px rgba(176, 141, 79, 0.08),
          0 20px 38px -26px rgba(61, 54, 41, 0.5);
      }

      svg {
        width: var(--icon-size, 74%);
        height: var(--icon-size, 74%);
        overflow: visible;
      }

      .ink {
        fill: none;
        stroke: var(--wine);
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: var(--icon-opacity, 0.26);
      }

      .gold {
        fill: none;
        stroke: var(--gold);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: var(--gold-opacity, 0.32);
      }

      .fill {
        fill: var(--pink);
        opacity: var(--fill-opacity, 0.16);
      }

      .seal {
        --icon-size: 76%;
        --icon-opacity: 0.3;
        --gold-opacity: 0.28;
        --fill-opacity: 0.13;
      }

      .engraved {
        --icon-size: 68%;
        --icon-opacity: 0.22;
        --gold-opacity: 0.4;
        --fill-opacity: 0;
      }

      .watermark {
        --icon-size: 88%;
        --icon-opacity: 0.14;
        --gold-opacity: 0.18;
        --fill-opacity: 0.11;
      }

      .small {
        --icon-size: 54%;
        --icon-opacity: 0.34;
        --gold-opacity: 0.34;
        --fill-opacity: 0.1;
      }

      strong {
        color: var(--ink);
        font-size: 0.72rem;
        font-weight: 400;
        letter-spacing: 0.16em;
        text-align: center;
        text-transform: uppercase;
      }

      @media (max-width: 820px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 460px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Heart Arrow</h1>
        <div class="rule"></div>
        <p>front face options</p>
      </header>

      <section class="grid" aria-label="Heart arrow dice front options">
        <article class="option seal">
          <div class="die">
            <svg viewBox="0 0 160 160" aria-hidden="true">
              <path class="fill" d="M80 126C48 99 28 78 28 53c0-17 13-31 30-31 10 0 19 5 24 13 5-8 14-13 24-13 17 0 30 14 30 31 0 25-20 46-52 73l-2 2-2-2Z"/>
              <path class="ink" d="M80 126C48 99 28 78 28 53c0-17 13-31 30-31 10 0 19 5 24 13 5-8 14-13 24-13 17 0 30 14 30 31 0 25-20 46-52 73l-2 2-2-2Z"/>
              <path class="gold" d="M30 92 130 55"/>
              <path class="gold" d="M130 55 116 47M130 55 122 70"/>
              <path class="gold" d="M30 92 45 97M30 92 40 78"/>
            </svg>
          </div>
          <strong>1 soft seal</strong>
        </article>

        <article class="option engraved">
          <div class="die">
            <svg viewBox="0 0 160 160" aria-hidden="true">
              <path class="ink" d="M80 122C51 97 34 78 34 56c0-15 11-26 25-26 10 0 18 5 23 13 5-8 13-13 23-13 14 0 25 11 25 26 0 22-17 41-46 66l-2 2-2-2Z"/>
              <path class="gold" d="M38 88 122 58"/>
              <path class="gold" d="M122 58 110 51M122 58 116 70"/>
            </svg>
          </div>
          <strong>2 engraved</strong>
        </article>

        <article class="option watermark">
          <div class="die">
            <svg viewBox="0 0 160 160" aria-hidden="true">
              <path class="fill" d="M80 127C45 98 25 76 25 51c0-18 14-32 32-32 11 0 20 5 25 14 5-9 14-14 25-14 18 0 32 14 32 32 0 25-20 47-55 76l-2 2-2-2Z"/>
              <path class="ink" d="M80 127C45 98 25 76 25 51c0-18 14-32 32-32 11 0 20 5 25 14 5-9 14-14 25-14 18 0 32 14 32 32 0 25-20 47-55 76l-2 2-2-2Z"/>
              <path class="gold" d="M22 96 138 52"/>
            </svg>
          </div>
          <strong>3 watermark</strong>
        </article>

        <article class="option small">
          <div class="die">
            <svg viewBox="0 0 160 160" aria-hidden="true">
              <path class="fill" d="M80 119C55 98 40 82 40 62c0-13 10-23 23-23 8 0 15 4 19 11 4-7 11-11 19-11 13 0 23 10 23 23 0 20-15 36-40 57l-2 2-2-2Z"/>
              <path class="ink" d="M80 119C55 98 40 82 40 62c0-13 10-23 23-23 8 0 15 4 19 11 4-7 11-11 19-11 13 0 23 10 23 23 0 20-15 36-40 57l-2 2-2-2Z"/>
              <path class="gold" d="M43 91 117 62"/>
              <path class="gold" d="M117 62 106 56M117 62 111 73"/>
            </svg>
          </div>
          <strong>4 small mark</strong>
        </article>
      </section>
    </main>
  </body>
</html>

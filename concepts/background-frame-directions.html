        --gold: #d9ad62;
        --bg: #10070c;

      * {

      body {

        min-width: 320px;

      }

      header {

      }

      .eyebrow {

        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        max-width: 920px;
        margin: 0;
        font-size: clamp(34px, 5vw, 68px);
        line-height: 0.96;
        letter-spacing: 0;

      .intro {
        max-width: 800px;
        margin: 14px 0 0;

        font-size: 18px;
        line-height: 1.55;

      .board {

        gap: 20px;

      .study {
        display: grid;
        grid-template-columns: minmax(300px, 430px) minmax(0, 1fr);
        gap: 28px;
        align-items: stretch;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.055), transparent 62%),
          #1a0b12;
      }

      .phone {
        min-height: 636px;
        padding: 18px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 28px;
        background: #080405;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
      }

      .screen {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 600px;
        overflow: hidden;
        padding: 22px;
        border-radius: 20px;
        isolation: isolate;
      }

      .screen::before,
      .screen::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
      }

      .topbar,
      .bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        margin: 0;
        font-size: 13px;
        font-weight: 950;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .pill,
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        padding: 6px 11px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        color: #ffe7ef;
        background: rgba(255, 255, 255, 0.07);
        font-size: 12px;
        font-weight: 850;
      }

      .button {
        min-height: 42px;
        border-color: rgba(217, 173, 98, 0.68);
        color: #17070d;
        background: linear-gradient(135deg, #f2d48a, #a67434);
      }

      .stage {
        display: grid;
        place-items: center;
        gap: 18px;
        padding: 34px 0 28px;
      }

      .object {
        position: relative;
        display: grid;
        place-items: center;
        width: min(100%, 318px);
        aspect-ratio: 1;
      }

      .object::before,
      .object::after,
      .mark::before,
      .mark::after {
        content: "";
        position: absolute;
        pointer-events: none;
      }

      .mark {
        position: relative;
        z-index: 2;
        display: grid;
        place-items: center;
        width: 43%;
        aspect-ratio: 1;
        color: #fff9fb;
        font-size: 30px;
        font-weight: 950;
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.58);
      }

      .caption {
        width: 100%;
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(14px);

        font-size: 22px;
        letter-spacing: 0;

        font-size: 17px;
        line-height: 1.55;

      .notes strong {
        color: var(--ink);

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Physics Prototype</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500&display=swap");

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        overflow: hidden;
        color: #fff8fb;
        background:
          radial-gradient(circle at 50% 34%, rgba(255, 241, 228, 0.08), transparent 26%),
          radial-gradient(circle at 44% 54%, rgba(111, 6, 34, 0.46), transparent 42%),
          linear-gradient(90deg, #30000d 0%, #5d001a 42%, #360028 100%);
        font-family: "Jost", "Avenir Next", "Segoe UI", sans-serif;
      }

      main {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 28px;
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: relative;
        z-index: 2;
        display: grid;
        width: min(92vw, 780px);
        min-height: min(78vh, 720px);
        grid-template-rows: auto 1fr auto;
        pointer-events: none;
      }

      header {
        text-align: center;
      }

      h1 {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(2.1rem, 7vw, 5rem);
        font-weight: 500;
        line-height: 0.95;
      }

      .hint {
        margin: 12px 0 0;
        color: rgba(255, 241, 228, 0.66);
        font-size: 0.78rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .result {
        align-self: end;
        min-height: 2.3em;
        margin: 0 auto 18px;
        color: #fff8fb;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(1.2rem, 4vw, 2rem);
        font-style: italic;
        font-weight: 500;
        line-height: 1.25;
        text-align: center;
        text-shadow: 0 18px 42px rgba(0, 0, 0, 0.55);
      }

      .controls {
        display: grid;
        justify-items: center;
        gap: 12px;
        pointer-events: auto;
      }

      button {
        border: 1px solid rgba(255, 241, 228, 0.26);
        border-radius: 999px;
        padding: 13px 30px;
        color: #fffdf8;
        background:
          radial-gradient(circle at 32% 22%, rgba(255, 255, 255, 0.25), transparent 30%),
          linear-gradient(145deg, #9c3140, #7c2334);
        box-shadow: 0 22px 46px -22px rgba(0, 0, 0, 0.7);
        font: inherit;
        font-size: 0.76rem;
        font-weight: 400;
        letter-spacing: 0.24em;
        text-indent: 0.24em;
        text-transform: uppercase;
      }

      button:disabled {
        opacity: 0.54;
      }

      .rule {
        width: min(86vw, 560px);
        margin: 0;
        color: rgba(255, 241, 228, 0.58);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        line-height: 1.45;
        text-align: center;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="hud">
        <header>
          <h1>Physics Dice</h1>
          <p class="hint" id="hint">playful game with your partner</p>
        </header>

        <p class="result" id="result"></p>

        <div class="controls">
          <button id="rollButton">Spicy Roll</button>
          <p class="rule">Rule: roll the dice one by one, then do the action.</p>
        </div>
      </div>
    </main>

    <script type="module">
      import * as THREE from "https://esm.sh/three@0.181.2";
      import * as CANNON from "https://esm.sh/cannon-es@0.20.0";

      const actions = ["Kiss", "Whisper", "Touch", "Massage", "Tease", "Hold"];
      const targets = ["Lips", "Neck", "Back", "Waist", "Thigh", "Collarbone"];
      const rules = ["10 seconds", "30 seconds", "Very slowly", "No talking", "Eyes closed", "Partner pace"];
      const diceSets = [actions, targets, rules];

      const result = document.querySelector("#result");
      const hint = document.querySelector("#hint");
      const rollButton = document.querySelector("#rollButton");

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x2b0016, 0.06);

      const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 5.4, 12);
      camera.lookAt(0, 0.15, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.prepend(renderer.domElement);

      const hemi = new THREE.HemisphereLight(0xfff8ee, 0x2b0016, 1.7);
      scene.add(hemi);

      const spot = new THREE.SpotLight(0xffdfca, 620, 32, Math.PI / 5, 0.55, 1.4);
      spot.position.set(-3.5, 8, 4.5);
      spot.castShadow = true;
      spot.shadow.mapSize.width = 2048;
      spot.shadow.mapSize.height = 2048;
      scene.add(spot);

      const world = new CANNON.World({
        gravity: new CANNON.Vec3(0, -15.5, 0),
      });
      world.allowSleep = true;
      world.broadphase = new CANNON.SAPBroadphase(world);

      const tableMaterial = new CANNON.Material("velvet");
      const diceMaterial = new CANNON.Material("dice");
      world.addContactMaterial(
        new CANNON.ContactMaterial(tableMaterial, diceMaterial, {
          friction: 0.62,
          restitution: 0.42,
        }),
      );

      const floorBody = new CANNON.Body({
        mass: 0,
        material: tableMaterial,
        shape: new CANNON.Plane(),
      });
      floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
      world.addBody(floorBody);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(16, 12),
        new THREE.MeshStandardMaterial({
          color: 0x3d1220,
          roughness: 0.92,
          metalness: 0,
        }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      function makeFaceTexture(text, index) {
        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext("2d");
        const gradient = ctx.createLinearGradient(0, 0, 512, 512);
        gradient.addColorStop(0, "#fffdf8");
        gradient.addColorStop(1, "#eadcc8");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 512, 512);
        ctx.strokeStyle = "rgba(176, 141, 79, 0.48)";
        ctx.lineWidth = 18;
        ctx.strokeRect(30, 30, 452, 452);
        ctx.fillStyle = index % 2 ? "#9c3140" : "#7c2334";
        ctx.font = text.length > 11 ? "500 54px Jost" : "500 68px Jost";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const parts = text.split(" ");
        if (parts.length > 1 && text.length > 11) {
          ctx.fillText(parts.slice(0, -1).join(" "), 256, 220);
          ctx.fillText(parts.at(-1), 256, 292);
        } else {
          ctx.fillText(text, 256, 256);
        }
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      function createDie(labels, startX) {
        const size = 0.96;
        const geometry = new THREE.BoxGeometry(size, size, size, 5, 5, 5);
        const materials = labels.map((label, index) =>
          new THREE.MeshStandardMaterial({
            map: makeFaceTexture(label, index),
            roughness: 0.68,
            metalness: 0.02,
          }),
        );
        const mesh = new THREE.Mesh(geometry, materials);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);

        const body = new CANNON.Body({
          mass: 1.25,
          material: diceMaterial,
          shape: new CANNON.Box(new CANNON.Vec3(size / 2, size / 2, size / 2)),
          linearDamping: 0.22,
          angularDamping: 0.18,
        });
        body.position.set(startX, 2.4, -0.5);
        world.addBody(body);

        return { body, mesh, labels, startX };
      }

      const dice = [
        createDie(actions, -1.7),
        createDie(targets, 0),
        createDie(rules, 1.7),
      ];

      function resetDie(die, lift = 2.7) {
        die.body.position.set(die.startX, lift, -0.4);
        die.body.velocity.set(0, 0, 0);
        die.body.angularVelocity.set(0, 0, 0);
        die.body.quaternion.setFromEuler(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      }

      function throwDie(die, index) {
        resetDie(die, 3.1);
        die.body.wakeUp();
        die.body.velocity.set((Math.random() - 0.5) * 1.8, 1.45 + Math.random() * 1.15, -2 - Math.random() * 0.9);
        die.body.angularVelocity.set(
          8 + Math.random() * 8,
          (index % 2 ? -1 : 1) * (10 + Math.random() * 10),
          7 + Math.random() * 8,
        );
      }

      function isResting(die) {
        return die.body.velocity.length() < 0.12 && die.body.angularVelocity.length() < 0.18 && die.body.position.y < 0.9;
      }

      function waitForRest(die) {
        return new Promise((resolve) => {
          const started = performance.now();
          const check = () => {
            if (isResting(die) || performance.now() - started > 5200) {
              resolve();
              return;
            }
            requestAnimationFrame(check);
          };
          check();
        });
      }

      async function rollAll() {
        rollButton.disabled = true;
        result.textContent = "";
        hint.textContent = "dice are rolling...";
        const chosen = [];

        for (let i = 0; i < dice.length; i += 1) {
          throwDie(dice[i], i);
          await waitForRest(dice[i]);
          chosen.push(diceSets[i][Math.floor(Math.random() * diceSets[i].length)]);
          result.textContent = chosen.join(" + ");
          await new Promise((resolve) => setTimeout(resolve, 320));
        }

        hint.textContent = "playful game with your partner";
        rollButton.disabled = false;
      }

      rollButton.addEventListener("click", rollAll);
      dice.forEach((die) => resetDie(die, 0.52));

      const clock = new THREE.Clock();
      let accumulator = 0;
      const fixedStep = 1 / 60;

      function animate() {
        requestAnimationFrame(animate);
        accumulator += Math.min(clock.getDelta(), 0.08);
        while (accumulator >= fixedStep) {
          world.step(fixedStep);
          accumulator -= fixedStep;
        }
        dice.forEach(({ body, mesh }) => {
          mesh.position.copy(body.position);
          mesh.quaternion.copy(body.quaternion);
        });
        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>

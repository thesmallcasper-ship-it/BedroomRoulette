<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tavla Style Dice Prototype</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500&display=swap");

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        overflow: hidden;
        color: #fff8fb;
        background:
          radial-gradient(circle at 50% 36%, rgba(255, 241, 228, 0.05), transparent 29%),
          radial-gradient(circle at 45% 52%, rgba(111, 6, 34, 0.42), transparent 39%),
          radial-gradient(circle at 74% 56%, rgba(67, 5, 62, 0.38), transparent 42%),
          linear-gradient(90deg, #30000d 0%, #5d001a 38%, #360028 100%);
        font-family: "Jost", "Avenir Next", "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: clamp(18px, 4vw, 36px);
      }

      .game {
        display: grid;
        width: min(94vw, 760px);
        justify-items: center;
      }

      header {
        margin-bottom: clamp(28px, 6vh, 52px);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(2.1rem, 7vw, 4.8rem);
        font-weight: 500;
        line-height: 0.95;
      }

      .hint {
        min-height: 1.2em;
        margin: 12px 0 0;
        color: rgba(255, 241, 228, 0.62);
        font-size: 0.76rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .tray {
        position: relative;
        display: grid;
        width: min(100%, 640px);
        min-height: clamp(230px, 42vh, 360px);
        place-items: center;
        border: 1px solid rgba(176, 141, 79, 0.18);
        border-radius: 999px;
        background:
          radial-gradient(circle at 50% 32%, rgba(255, 253, 248, 0.16), transparent 36%),
          radial-gradient(ellipse at 50% 76%, rgba(176, 141, 79, 0.14), transparent 60%),
          linear-gradient(180deg, rgba(255, 253, 248, 0.03), rgba(30, 8, 17, 0.1));
        box-shadow:
          inset 0 2px 22px rgba(255, 255, 255, 0.06),
          inset 0 -26px 60px rgba(54, 0, 40, 0.16),
          0 34px 80px -46px rgba(0, 0, 0, 0.8);
      }

      .tray::before {
        content: "";
        position: absolute;
        right: 10%;
        bottom: 16%;
        left: 10%;
        height: 28px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(22, 4, 12, 0.42), transparent 72%);
        filter: blur(10px);
      }

      .dice-row {
        position: relative;
        z-index: 1;
        display: grid;
        width: min(92%, 520px);
        grid-template-columns: repeat(3, minmax(92px, 1fr));
        align-items: center;
        gap: clamp(16px, 5vw, 42px);
      }

      .die-wrap {
        position: relative;
        display: grid;
        min-width: 0;
        justify-items: center;
      }

      .die-shadow {
        position: absolute;
        bottom: -20px;
        width: 74%;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(22, 4, 12, 0.46), transparent 70%);
        filter: blur(5px);
        opacity: 0.7;
        transform: scale(var(--shadow-scale, 1));
      }

      .die {
        --die-tilt: -3deg;
        position: relative;
        display: grid;
        width: min(100%, clamp(92px, 17vw, 126px));
        aspect-ratio: 1;
        place-items: center;
        border: 1px solid rgba(176, 141, 79, 0.42);
        border-radius: 18px;
        color: #3d3629;
        background:
          radial-gradient(circle at 26% 18%, rgba(255, 255, 255, 0.94), transparent 30%),
          radial-gradient(circle at 76% 82%, rgba(176, 141, 79, 0.18), transparent 34%),
          linear-gradient(145deg, #fffdf8, #eee3cf);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.72),
          inset -8px -10px 18px rgba(176, 141, 79, 0.1),
          0 20px 34px -22px rgba(0, 0, 0, 0.62);
        transform: translate3d(0, 0, 0) rotate(var(--die-tilt));
        transform-origin: 50% 58%;
        will-change: transform, filter;
      }

      .die::after {
        content: "";
        position: absolute;
        inset: 8px;
        border: 1px solid rgba(176, 141, 79, 0.18);
        border-radius: 13px;
        pointer-events: none;
      }

      .die-1 {
        --die-tilt: -4deg;
      }

      .die-2 {
        --die-tilt: 1deg;
      }

      .die-3 {
        --die-tilt: -1deg;
      }

      .die-value {
        position: relative;
        z-index: 1;
        max-width: 84%;
        color: #7c2334;
        font-size: clamp(0.72rem, 1.7vw, 0.95rem);
        font-weight: 500;
        letter-spacing: 0.04em;
        line-height: 1.12;
        overflow-wrap: anywhere;
        text-align: center;
        text-transform: uppercase;
      }

      .die.rolling .die-value {
        color: rgba(124, 35, 52, 0.46);
      }

      .die.locked {
        animation: settle 210ms cubic-bezier(0.18, 0.92, 0.24, 1.08) both;
      }

      .result {
        min-height: 1.8em;
        margin: clamp(22px, 4vh, 34px) 0 0;
        color: #9c3140;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(1.2rem, 4vw, 1.8rem);
        font-style: italic;
        font-weight: 500;
        line-height: 1.3;
        text-align: center;
      }

      button {
        margin-top: 18px;
        border: 1px solid rgba(156, 49, 64, 0.32);
        border-radius: 999px;
        padding: 12px 28px;
        color: #fffdf8;
        background:
          radial-gradient(circle at 32% 22%, rgba(255, 255, 255, 0.24), transparent 30%),
          linear-gradient(145deg, #9c3140, #7c2334);
        box-shadow: 0 18px 34px -20px rgba(61, 54, 41, 0.5);
        font: inherit;
        font-size: 0.76rem;
        font-weight: 300;
        letter-spacing: 0.24em;
        text-indent: 0.24em;
        text-transform: uppercase;
      }

      button:disabled {
        opacity: 0.55;
      }

      .rule {
        width: min(86vw, 540px);
        margin: 10px 0 0;
        color: rgba(61, 54, 41, 0.52);
        font-size: 0.72rem;
        font-weight: 300;
        letter-spacing: 0.08em;
        line-height: 1.45;
        text-align: center;
        text-transform: uppercase;
      }

      @keyframes settle {
        0% {
          transform: translate3d(0, -7px, 0) rotate(calc(var(--die-tilt) - 5deg)) scale(1.03);
          filter: blur(0.2px);
        }

        100% {
          transform: translate3d(0, 0, 0) rotate(var(--die-tilt)) scale(1);
          filter: blur(0);
        }
      }

      @media (max-width: 640px) {
        .tray {
          min-height: 230px;
        }

        .dice-row {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="game" aria-label="Tavla style dice prototype">
        <header>
          <h1>Tavla Roll</h1>
          <p class="hint" id="hint">playful game with your partner</p>
        </header>

        <div class="tray">
          <div class="dice-row">
            <div class="die-wrap">
              <span class="die-shadow" aria-hidden="true"></span>
              <span class="die die-1" data-key="action"><span class="die-value">Action</span></span>
            </div>
            <div class="die-wrap">
              <span class="die-shadow" aria-hidden="true"></span>
              <span class="die die-2" data-key="target"><span class="die-value">Target</span></span>
            </div>
            <div class="die-wrap">
              <span class="die-shadow" aria-hidden="true"></span>
              <span class="die die-3" data-key="rule"><span class="die-value">Rule</span></span>
            </div>
          </div>
        </div>

        <p class="result" id="result" aria-live="polite"></p>
        <button id="rollButton">Spicy Roll</button>
        <p class="rule">Rule: roll the dice one by one, then do the action.</p>
      </section>
    </main>

    <script>
      const diceData = {
        action: ["Kiss", "Whisper", "Touch", "Massage", "Tease", "Hold", "Trace", "Caress"],
        target: ["Lips", "Neck", "Back", "Waist", "Thigh", "Chest", "Collarbone", "Hands"],
        rule: ["10 seconds", "30 seconds", "1 minute", "Very slowly", "No talking", "Eyes closed"],
      };

      const rollButton = document.querySelector("#rollButton");
      const hint = document.querySelector("#hint");
      const result = document.querySelector("#result");
      const dice = [...document.querySelectorAll(".die")];

      function pick(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function wait(ms) {
        return new Promise((resolve) => window.setTimeout(resolve, ms));
      }

      function makeFrames() {
        const drift = Math.round((Math.random() - 0.5) * 18);
        const side = Math.random() > 0.5 ? 1 : -1;

        return [
          { offset: 0, transform: "translate3d(0, 0, 0) rotate(var(--die-tilt)) scale(1)", filter: "blur(0)" },
          {
            offset: 0.12,
            transform: `translate3d(${side * 9}px, -18px, 0) rotate(${side * 26}deg) scale(1.05)`,
            filter: "blur(0.7px)",
          },
          {
            offset: 0.26,
            transform: `translate3d(${drift}px, 7px, 0) rotate(${side * -18}deg) scale(0.98)`,
            filter: "blur(0.35px)",
          },
          {
            offset: 0.43,
            transform: `translate3d(${side * -14}px, -13px, 0) rotate(${side * 34}deg) scale(1.04)`,
            filter: "blur(0.8px)",
          },
          {
            offset: 0.62,
            transform: `translate3d(${drift * -0.55}px, 4px, 0) rotate(${side * -14}deg) scale(1)`,
            filter: "blur(0.28px)",
          },
          {
            offset: 0.8,
            transform: `translate3d(${side * 5}px, -7px, 0) rotate(${side * 9}deg) scale(1.015)`,
            filter: "blur(0.16px)",
          },
          { offset: 1, transform: "translate3d(0, 0, 0) rotate(var(--die-tilt)) scale(1)", filter: "blur(0)" },
        ];
      }

      async function animateDie(die, finalValue, index) {
        const value = die.querySelector(".die-value");
        const key = die.dataset.key;
        const pool = diceData[key];
        const shadow = die.parentElement.querySelector(".die-shadow");

        die.classList.remove("locked");
        die.classList.add("rolling");

        const shuffle = window.setInterval(() => {
          value.textContent = pick(pool);
        }, 64);

        const duration = 720 + index * 110 + Math.round(Math.random() * 170);
        const dieAnimation = die.animate(makeFrames(), {
          duration,
          easing: "cubic-bezier(0.16, 0.8, 0.22, 1)",
          fill: "both",
        });

        const shadowAnimation = shadow.animate(
          [
            { transform: "scale(1)", opacity: 0.7 },
            { transform: "scale(0.72)", opacity: 0.38, offset: 0.16 },
            { transform: "scale(1.18)", opacity: 0.76, offset: 0.34 },
            { transform: "scale(0.82)", opacity: 0.45, offset: 0.58 },
            { transform: "scale(1)", opacity: 0.7 },
          ],
          {
            duration,
            easing: "cubic-bezier(0.16, 0.8, 0.22, 1)",
            fill: "both",
          },
        );

        await Promise.all([dieAnimation.finished, shadowAnimation.finished]);
        window.clearInterval(shuffle);
        value.textContent = finalValue;
        die.classList.remove("rolling");
        die.classList.add("locked");
      }

      async function roll() {
        rollButton.disabled = true;
        hint.textContent = "dice are rolling...";
        result.textContent = "";

        const chosen = [
          pick(diceData.action),
          pick(diceData.target),
          pick(diceData.rule),
        ];

        for (let index = 0; index < dice.length; index += 1) {
          await animateDie(dice[index], chosen[index], index);
          result.textContent = chosen.slice(0, index + 1).join(" + ");
          await wait(150);
        }

        hint.textContent = "playful game with your partner";
        rollButton.disabled = false;
      }

      rollButton.addEventListener("click", roll);
    </script>
  </body>
</html>
